name: Pagewell iPad installation build
run-name: Pagewell iPad ${{ inputs.version }} build ${{ inputs.build }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: '0.1.8'
      build:
        type: string
        required: true
        default: '1011'
      source_tag:
        type: string
        required: true
        default: 'v0.1.8'
      source_asset:
        type: string
        required: true
        default: 'Pagewell-0.1.8.apk'
      source_sha256:
        type: string
        required: true
      source_kind:
        type: choice
        options: [apk, web]
        default: apk
      notes:
        type: string
        required: true
        default: 'Pagewell iPad update.'

permissions:
  contents: write

concurrency:
  group: pagewell-ipad-install
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PAGEWELL_VERSION: ${{ inputs.version }}
      PAGEWELL_BUILD: ${{ inputs.build }}
      PAGEWELL_SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PAGEWELL_SOURCE_TAG: ${{ inputs.source_tag }}
      PAGEWELL_SOURCE_ASSET: ${{ inputs.source_asset }}
      PAGEWELL_SOURCE_KIND: ${{ inputs.source_kind }}
      PAGEWELL_NOTES: ${{ inputs.notes }}
    steps:
      - name: Build an unsigned native iPad package from the published app
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGEWELL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PAGEWELL_BUILD" =~ ^[0-9]+$ ]]
          [[ "$PAGEWELL_SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PAGEWELL_SOURCE_TAG" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$PAGEWELL_SOURCE_ASSET" =~ ^[A-Za-z0-9_.-]+$ ]]
          export PAGEWELL_BUILD_TAG="ipad-v$PAGEWELL_VERSION-b$PAGEWELL_BUILD"
          mkdir -p "$RUNNER_TEMP/pagewell-ipad"
          cd "$RUNNER_TEMP/pagewell-ipad"
          gh release download "$PAGEWELL_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PAGEWELL_SOURCE_ASSET" --output source.zip
          echo "$PAGEWELL_SOURCE_SHA256  source.zip" | shasum -a 256 --check
          if [ "$PAGEWELL_SOURCE_KIND" = apk ]; then
            unzip -q source.zip 'assets/public/*' -d extracted
            mv extracted/assets/public dist
          elif [ "$PAGEWELL_SOURCE_KIND" = web ]; then
            mkdir dist
            unzip -q source.zip -d dist
          else exit 1; fi
          test -f dist/index.html
          python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path('dist/index.html')
          text=path.read_text()
          assert text.count('<head>')==1
          path.write_text(text.replace('<head>','<head><script>window.__PAGEWELL_IPAD_BUILD__='+str(int(os.environ['PAGEWELL_BUILD']))+';</script>',1))
          PY
          cat > package.json <<'JSON'
          {"name":"pagewell-ipad","version":"0.1.8","private":true,"dependencies":{"@capacitor/core":"8.5.3","@capacitor/ios":"8.5.3","@capacitor/cli":"8.5.3"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.benighter.pagewell","appName":"Pagewell","webDir":"dist","ios":{"backgroundColor":"#ffffff","preferredContentMode":"recommended","zoomEnabled":false},"plugins":{"SplashScreen":{"launchShowDuration":0}}}
          JSON
          npm install --no-audit --no-fund
          export DEVELOPER_DIR=$(python3 - <<'PY'
          import plistlib,re
          from pathlib import Path
          choices=[]
          for app in Path('/Applications').glob('Xcode*.app'):
            with (app/'Contents/Info.plist').open('rb') as f: version=plistlib.load(f)['CFBundleShortVersionString']
            numbers=tuple(int(v) for v in re.findall(r'\d+',version))
            if numbers and numbers[0]>=26: choices.append(('beta' not in app.name.lower(),numbers,str(app/'Contents/Developer')))
          if not choices: raise SystemExit('This runner has no Xcode 26 or later')
          print(max(choices)[2])
          PY
          )
          test -n "$DEVELOPER_DIR"
          npx cap add ios
          python3 - <<'PY'
          from pathlib import Path
          delegate=Path('ios/App/App/AppDelegate.swift')
          delegate.write_text(delegate.read_text()+'''

          // Keep the workspace inside system bars in every iPad window size.
          final class PagewellViewController: CAPBridgeViewController {
              override func capacitorDidLoad() {
                  super.capacitorDidLoad()
                  guard let webView = webView else { return }
                  let container = UIView(frame: view.bounds)
                  container.backgroundColor = .systemBackground
                  view = container
                  webView.translatesAutoresizingMaskIntoConstraints = false
                  webView.scrollView.pinchGestureRecognizer?.isEnabled = false
                  webView.scrollView.bounces = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.automaticallyAdjustsScrollIndicatorInsets = false
                  container.addSubview(webView)
                  let safeArea = container.safeAreaLayoutGuide
                  NSLayoutConstraint.activate([
                      webView.topAnchor.constraint(equalTo: safeArea.topAnchor),
                      webView.bottomAnchor.constraint(equalTo: container.keyboardLayoutGuide.topAnchor),
                      webView.leadingAnchor.constraint(equalTo: safeArea.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: safeArea.trailingAnchor)
                  ])
              }
          }
          ''')
          scene=Path('ios/App/App/SceneDelegate.swift')
          original='window?.rootViewController = CAPBridgeViewController()'
          text=scene.read_text()
          assert text.count(original)==1, 'Unexpected Capacitor scene startup'
          scene.write_text(text.replace(original,'window?.rootViewController = PagewellViewController()'))
          storyboard=Path('ios/App/App/Base.lproj/Main.storyboard')
          original='customClass="CAPBridgeViewController" customModule="Capacitor"'
          text=storyboard.read_text()
          assert text.count(original)==1, 'Unexpected Capacitor storyboard'
          storyboard.write_text(text.replace(original,'customClass="PagewellViewController" customModule="App" customModuleProvider="target"'))
          PY
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          export ICON_DIR
          test -f dist/logo.png
          python3 -m pip install --quiet --disable-pip-version-check --no-deps --target "$RUNNER_TEMP/pagewell-image-tools" Pillow==13.0.0
          PYTHONPATH="$RUNNER_TEMP/pagewell-image-tools" python3 - <<'PY'
          import json,os
          from pathlib import Path
          from PIL import Image
          logo=Image.open('dist/logo.png').convert('RGBA').resize((704,704),Image.Resampling.LANCZOS)
          icon=Image.new('RGB',(1024,1024),'white')
          icon.paste(logo,(160,160),logo)
          icon.save(Path(os.environ['ICON_DIR'])/'Pagewell.png')
          p=Path(os.environ['ICON_DIR'])/'Contents.json'
          p.write_text(json.dumps({'images':[{'filename':'Pagewell.png','idiom':'universal','platform':'ios','size':'1024x1024'}],'info':{'author':'xcode','version':1}}))
          PY
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' MARKETING_VERSION="$PAGEWELL_VERSION" CURRENT_PROJECT_VERSION="$PAGEWELL_BUILD" build > xcode-build.log 2>&1 || { tail -n 100 xcode-build.log; exit 1; }
          APP=build/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = com.benighter.pagewell
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = "$PAGEWELL_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = "$PAGEWELL_BUILD"
          file "$APP/App" | tee executable-architecture.txt
          file "$APP/App" | grep -q arm64
          mkdir Payload
          ditto "$APP" Payload/Pagewell.app
          ditto -c -k --sequesterRsrc --keepParent Payload "Pagewell-$PAGEWELL_VERSION-iPad-b$PAGEWELL_BUILD-unsigned.ipa"
          shasum -a 256 "Pagewell-$PAGEWELL_VERSION-iPad-b$PAGEWELL_BUILD-unsigned.ipa" > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json,os,plistlib
          from pathlib import Path
          info=plistlib.loads(Path('Payload/Pagewell.app/Info.plist').read_bytes())
          proof={'name':'Pagewell','version':info['CFBundleShortVersionString'],'build':info['CFBundleVersion'],'bundleId':info['CFBundleIdentifier'],'minimumOS':info['MinimumOSVersion'],'architectures':['arm64'],'unsigned':True,'requiresAppleSigningBeforeInstallation':True,'sourceKind':os.environ['PAGEWELL_SOURCE_KIND'],'sourceSha256':os.environ['PAGEWELL_SOURCE_SHA256'],'workflowCommit':os.environ['GITHUB_SHA'],'nativeSafeAreaLayout':True}
          Path('IPAD-BUILD.json').write_text(json.dumps(proof,indent=2)+'\n')
          package=Path('Pagewell-'+os.environ['PAGEWELL_VERSION']+'-iPad-b'+os.environ['PAGEWELL_BUILD']+'-unsigned.ipa')
          tag=os.environ['PAGEWELL_BUILD_TAG']
          manifest={'schema':1,'version':info['CFBundleShortVersionString'],'build':int(info['CFBundleVersion']),'bundleId':info['CFBundleIdentifier'],'size':package.stat().st_size,'sha256':hashlib.sha256(package.read_bytes()).hexdigest(),'url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+tag+'/'+package.name,'notes':os.environ['PAGEWELL_NOTES']}
          Path('ipad-update.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('RELEASE-NOTES.md').write_text(os.environ['PAGEWELL_NOTES']+'\n')
          PY
          existing_draft=$(gh release view "$PAGEWELL_BUILD_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ -n "$existing_draft" ] && [ "$existing_draft" != true ]; then echo 'Refusing to replace a published release'; exit 1; fi
          if [ -z "$existing_draft" ]; then gh release create "$PAGEWELL_BUILD_TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Pagewell $PAGEWELL_VERSION for iPad (build $PAGEWELL_BUILD)" --notes-file RELEASE-NOTES.md; fi
          gh release upload "$PAGEWELL_BUILD_TAG" --repo "$GITHUB_REPOSITORY" "Pagewell-$PAGEWELL_VERSION-iPad-b$PAGEWELL_BUILD-unsigned.ipa" SHA256SUMS.txt IPAD-BUILD.json ipad-update.json RELEASE-NOTES.md --clobber
